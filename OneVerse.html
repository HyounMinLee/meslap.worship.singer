<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efede7; --text:#1b1a18; --muted:#7d7a74; --faint:#b8b5ae; --line:#e7e4dd;
  --accent:#2f7366; --accent-2:#48998a; --accent-ink:#ffffff; --accent-soft:#e1efeb;
  --sun:#d4553f; --sat:#3f6fd4; --danger:#d4553f;
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.42);
  --shadow:0 1px 2px rgba(30,25,20,.04),0 12px 32px rgba(30,25,20,.07);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111214; --surface:#1a1b1e; --surface-2:#25262a; --text:#f2f1ec; --muted:#9d9ba3; --faint:#55565c; --line:#2d2e33;
    --accent:#6cc3b2; --accent-2:#4fa898; --accent-ink:#0e1d1a; --accent-soft:#1d332f;
    --sun:#ef7a66; --sat:#7ea2ef; --danger:#ef7a66;
    --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.05);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.28);
  }
}
/* 날짜별 팔레트: 요소의 style 속성에 --pa/--pb/--pacc(라이트), --pda/--pdb/--pdacc(다크)를 지정 */
.pal{--ga:var(--pa);--gb:var(--pb);--gacc:var(--pacc)}
@media (prefers-color-scheme: dark){.pal{--ga:var(--pda);--gb:var(--pdb);--gacc:var(--pdacc)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.01em;
  overscroll-behavior-x:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}

/* 배경 그래픽 */
.blob{position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(64px);transition:background-color .9s ease}
.blob.b1{width:85vw;height:85vw;max-width:560px;max-height:560px;top:-34vw;right:-28vw;background-color:var(--gb);opacity:.75}
.blob.b2{width:65vw;height:65vw;max-width:420px;max-height:420px;top:22vh;left:-38vw;background-color:var(--ga);opacity:.6}
@media (min-width:600px){.blob.b1{top:-240px;right:calc(50% - 560px)}.blob.b2{left:calc(50% - 560px)}}
@media (prefers-color-scheme: dark){.blob.b1{opacity:.55}.blob.b2{opacity:.4}}

.app{max-width:560px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}

/* 상단 */
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 4px 0}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:750;letter-spacing:-.02em}
.brand svg{width:28px;height:28px;border-radius:8px;box-shadow:0 4px 10px rgba(47,115,102,.25)}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 20px 12px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.topbar-text{min-width:0}

  </button>
  <input type="file" id="importInput" accept="application/json,.json" multiple hidden>
  <p class="set-help">구절은 이 기기의 브라우저에만 저장돼요. 브라우저 데이터를 지우거나 기기를 바꾸면 사라지므로 주기적으로 백업 파일을 내보내 두세요.</p>
  <button class="btn ghost full" data-close>닫기</button>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ================= 기본 상수 / 유틸 ================= */
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const VIEWS = ['day', 'week', 'month'];
  const KEYS = { data: 'dailyVerse.v1', view: 'dailyVerse.view', backup: 'dailyVerse.lastBackup' };
  const LIMITS = { reference: 100, text: 2000, note: 2000 };
  const BACKUP_REMIND_DAYS = 14;
  const DAY_MS = 86400000;

  // 날짜별 팔레트 (라이트 a/b/acc, 다크 da/db/dacc)
  const PALETTES = [
    { a: '#ffe6d0', b: '#ffcbb6', acc: '#b4563a', da: '#3b2620', db: '#2b1c1e', dacc: '#f2a184' }, // 새벽
    { a: '#e3efd8', b: '#c8dfc4', acc: '#4a7a45', da: '#1f2c1f', db: '#1a2520', dacc: '#a5d39b' }, // 올리브
    { a: '#dcebfb', b: '#c3d6f4', acc: '#3a62a6', da: '#1c2638', db: '#1a1f33', dacc: '#9dbcf0' }, // 하늘
    { a: '#ebe3fb', b: '#d5caf3', acc: '#6a50b0', da: '#2a2238', db: '#221d33', dacc: '#c3b2f2' }, // 라벤더
    { a: '#f6ecd4', b: '#ebdab4', acc: '#8a6629', da: '#302a1d', db: '#28221a', dacc: '#e3c784' }, // 모래
    { a: '#fce3e9', b: '#f3c8d4', acc: '#a8456a', da: '#36202a', db: '#2c1b25', dacc: '#f0a0bd' }, // 장미
    { a: '#d6f0ed', b: '#bbe2dc', acc: '#2b7970', da: '#1a2f2d', db: '#172826', dacc: '#8ad5cb' }, // 청록
  ];

  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const isValidKey = (k) => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && keyOf(parseKey(k)) === k;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const addMonths = (d, n) => {
    const last = new Date(d.getFullYear(), d.getMonth() + n + 1, 0).getDate();
    return new Date(d.getFullYear(), d.getMonth() + n, Math.min(d.getDate(), last));
  };
  const startOfWeek = (d) => addDays(d, -d.getDay());
  const todayDate = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const sameDay = (a, b) => keyOf(a) === keyOf(b);
  const dayNumber = (d) => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS);
  const dayOfYear = (d) => dayNumber(d) - dayNumber(new Date(d.getFullYear(), 0, 1)) + 1;
  const daysBetween = (a, b) => { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const paletteFor = (d) => PALETTES[((dayNumber(d) % 7) + 7) % 7];
  const palStyle = (p) => `--pa:${p.a};--pb:${p.b};--pacc:${p.acc};--pda:${p.da};--pdb:${p.db};--pdacc:${p.dacc}`;

  /* ================= 저장소 (localStorage) ================= */
  const LS = (() => { try { const s = window.localStorage; s.getItem('_'); return s; } catch { return null; } })();
  const pref = {
    get(k) { try { return LS ? LS.getItem(k) : null; } catch { return null; } },
    set(k, v) { try { if (LS) LS.setItem(k, v); } catch { /* 설정값 저장 실패는 무시 */ } },
  };

  function normalizeEntry(e) {
    if (!e || typeof e !== 'object' || !isValidKey(e.date)) return null;
    const out = { date: e.date };
    for (const [field, max] of Object.entries(LIMITS)) {
      const v = e[field] == null ? '' : e[field];
      if (typeof v !== 'string') return null;
      out[field] = v.trim().slice(0, max);
    }
    if (!out.text) return null;
    const now = new Date().toISOString();
    out.createdAt = typeof e.createdAt === 'string' ? e.createdAt : now;
    out.updatedAt = typeof e.updatedAt === 'string' ? e.updatedAt : now;
    return out;
  }

  // 지원 형식: {entries:{날짜:구절}} / {entries:[...]} / {items:[...]} / [...] / 단일 구절 객체(이전 서버 버전 파일)
  function extractEntries(obj) {
    if (Array.isArray(obj)) return obj;
    if (!obj || typeof obj !== 'object') return [];
    if (obj.entries && typeof obj.entries === 'object') return Array.isArray(obj.entries) ? obj.entries : Object.values(obj.entries);
    if (Array.isArray(obj.items)) return obj.items;
    if (obj.date) return [obj];
    return [];
  }

  const db = {
    map: new Map(),
    writable: !!LS,
    warning: LS ? '' : '이 브라우저에서는 저장소를 사용할 수 없어요',

    load() {
      if (!LS) return;
      let raw = null;
      try { raw = LS.getItem(KEYS.data); } catch { this.writable = false; this.warning = '저장소에 접근할 수 없어요'; return; }
      if (!raw) return;
      try {
        extractEntries(JSON.parse(raw)).forEach((x) => { const n = normalizeEntry(x); if (n) this.map.set(n.date, n); });
      } catch (err) {
        // 손상된 원본은 덮어쓰기 전에 별도 키로 보관
        console.error('저장 데이터가 손상되었습니다', err);
        try { LS.setItem(`${KEYS.data}.corrupt-${Date.now()}`, raw); } catch { /* 보관 실패 */ }
        this.warning = '저장 데이터가 손상되어 별도로 보관했어요. 백업 파일로 복구해 주세요';
      }
    },

    snapshot() {
      const entries = {};
      [...this.map.keys()].sort().forEach((k) => { entries[k] = this.map.get(k); });
      return { app: 'daily-verse', version: 1, savedAt: new Date().toISOString(), entries };
    },

    /** 변경 후 저장. 실패하면 메모리 상태를 되돌림 */
    transact(fn) {
      if (!this.writable) throw new Error(this.warning || '저장할 수 없어요');
      const before = new Map(this.map);
      fn(this.map);
      try {
        LS.setItem(KEYS.data, JSON.stringify(this.snapshot()));
      } catch (err) {
        this.map = before;
        console.error('저장 실패', err);
        throw new Error(err && err.name === 'QuotaExceededError' ? '저장 공간이 부족해요' : '저장하지 못했어요');
      }
      requestPersist();
    },

    get(k) { return this.map.get(k) || null; },
    get size() { return this.map.size; },
  };

  let persistAsked = false;
  function requestPersist() {
    if (persistAsked || !navigator.storage || !navigator.storage.persist) return;
    persistAsked = true;
    navigator.storage.persisted()
      .then((p) => (p ? true : navigator.storage.persist()))
      .catch((e) => console.warn('영구 저장 요청 실패', e));
  }

  /* ================= 상태 ================= */
  const savedView = pref.get(KEYS.view);
  const state = {
    view: VIEWS.includes(savedView) ? savedView : 'day',
    cursor: todayDate(),
    animating: false,
    lastSwipeAt: 0,
    editingKey: null,
  };

  const el = {
    eyebrow: $('#eyebrow'), title: $('#title'), seg: $('#seg'), viewport: $('#viewport'), stage: $('#stage'),
    prevBtn: $('#prevBtn'), nextBtn: $('#nextBtn'), todayBtn: $('#todayBtn'), fab: $('#fab'),
    settingsBtn: $('#settingsBtn'), backupBadge: $('#backupBadge'), backdrop: $('#backdrop'),
    form: $('#form'), editTitle: $('#editTitle'), fDate: $('#fDate'), fRef: $('#fRef'), fText: $('#fText'), fNote: $('#fNote'),
    delBtn: $('#delBtn'), saveBtn: $('#saveBtn'),
    sTotal: $('#sTotal'), sBackup: $('#sBackup'), sPersist: $('#sPersist'),
    exportBtn: $('#exportBtn'), importBtn: $('#importBtn'), importInput: $('#importInput'), toast: $('#toast'),
  };

  /* ================= 그래픽 조각 ================= */
  const RAYS = (() => {
    let lines = '';
    for (let i = 0; i < 9; i++) {
      const a = (102 + i * 8.5) * Math.PI / 180;
      lines += `<line x1="300" y1="0" x2="${(300 + Math.cos(a) * 480).toFixed(1)}" y2="${(Math.sin(a) * 480).toFixed(1)}" stroke-width="${i % 2 ? 16 : 6}"/>`;
    }
    return `<svg class="rays" viewBox="0 0 300 300" preserveAspectRatio="xMaxYMin slice" aria-hidden="true"><g stroke="currentColor" stroke-linecap="round">${lines}</g></svg>`;
  })();

  const SPRIG = '<svg viewBox="0 0 140 24" aria-hidden="true"><path d="M8 12H50M90 12H132" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".45"/><path d="M70 5l4 7-4 7-4-7z" fill="currentColor"/><path d="M63 12c-3-5-8-7-13-5 2 4 7 6 13 5z" fill="currentColor" opacity=".75"/><path d="M77 12c3-5 8-7 13-5-2 4-7 6-13 5z" fill="currentColor" opacity=".75"/><path d="M63 12c-3 5-8 7-13 5 2-4 7-6 13-5z" fill="currentColor" opacity=".45"/><path d="M77 12c3 5 8 7 13 5-2-4-7-6-13-5z" fill="currentColor" opacity=".45"/></svg>';

  const ILLUS = (() => {
    let rays = '';
    for (let deg = -165; deg <= -15; deg += 25) {
      const r = deg * Math.PI / 180;
      rays += `<line x1="${(100 + Math.cos(r) * 34).toFixed(1)}" y1="${(54 + Math.sin(r) * 34).toFixed(1)}" x2="${(100 + Math.cos(r) * 46).toFixed(1)}" y2="${(54 + Math.sin(r) * 46).toFixed(1)}"/>`;
    }
    return `<svg class="illus" viewBox="0 0 200 140" aria-hidden="true">
      <circle cx="100" cy="54" r="27" fill="currentColor" opacity=".14"/>
      <circle cx="100" cy="54" r="15" fill="currentColor" opacity=".3"/>
      <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".35">${rays}</g>
      <ellipse cx="100" cy="131" rx="70" ry="5" fill="currentColor" opacity=".1"/>
      <path class="paper" d="M100 88C80 78 54 76 32 82v42c22-6 48-4 68 6z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path class="paper" d="M100 88c20-10 46-12 68-6v42c-22-6-48-4-68 6z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M44 93c15-3 32-2 46 4M44 103c15-3 32-2 46 4M44 113c15-3 32-2 46 4M156 93c-15-3-32-2-46 4M156 103c-15-3-32-2-46 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity=".3"/>
      <path d="M150 116c6-10 14-17 26-22" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity=".7"/>
      <path d="M160 106c-4-5-4-11 0-15 4 5 4 11 0 15zM168 101c1-6 6-10 11-10-1 6-6 10-11 10zM155 113c-6-1-10-5-11-10 6 0 10 4 11 10z" fill="currentColor" opacity=".7"/>
    </svg>`;
  })();

  const ICON = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.4 5.2-6.1 2.5-.5 5-2 6.8-3.9"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  };

  /* ================= 통계 ================= */
  function streakCount() {
    let d = todayDate();
    if (!db.get(keyOf(d))) d = addDays(d, -1);
    let n = 0;
    while (db.get(keyOf(d))) { n++; d = addDays(d, -1); }
    return n;
  }

  /* ================= 렌더링 ================= */
  function isCurrentPeriod() {
    const c = state.cursor, t = todayDate();
    if (state.view === 'day') return sameDay(c, t);
    if (state.view === 'week') return sameDay(startOfWeek(c), startOfWeek(t));
    return c.getFullYear() === t.getFullYear() && c.getMonth() === t.getMonth();
  }

  function renderHeader() {
    const c = state.cursor;
    let year = c.getFullYear();
    let title;
    if (state.view === 'day') {
      title = `${c.getMonth() + 1}월 ${c.getDate()}일 ${DOW[c.getDay()]}요일`;
    } else if (state.view === 'week') {
      const s = startOfWeek(c), e = addDays(s, 6);
      year = s.getFullYear();
      title = s.getMonth() === e.getMonth()
        ? `${s.getMonth() + 1}월 ${s.getDate()}일 – ${e.getDate()}일`
        : `${s.getMonth() + 1}.${s.getDate()} – ${e.getMonth() + 1}.${e.getDate()}`;
    } else {
      title = `${c.getMonth() + 1}월`;
    }
    const current = isCurrentPeriod();
    const tag = { day: '오늘', week: '이번 주', month: '이번 달' }[state.view];
    el.eyebrow.innerHTML = `${year}년${current ? `<span class="today-tag">${tag}</span>` : ''}`;
    el.title.textContent = title;
    el.todayBtn.disabled = current;
  }

  function verseCardHTML(e, d) {
    const k = keyOf(d);
    return `<article class="verse-card pal" style="${palStyle(paletteFor(d))}">
      ${RAYS}<span class="glow g1"></span><span class="glow g2"></span>
      <div class="vc-inner">
        <div class="vc-top">
          <span class="vc-day">DAY ${String(dayOfYear(d)).padStart(3, '0')}</span>
          ${e.reference ? `<span class="ref">${esc(e.reference)}</span>` : ''}
        </div>
        <span class="qmark" aria-hidden="true">“</span>
        <blockquote class="verse">${esc(e.text)}</blockquote>
        <div class="ornament">${SPRIG}</div>
        ${e.note ? `<div class="note"><span class="note-label">${ICON.leaf}묵상</span><p>${esc(e.note)}</p></div>` : ''}
        <div class="card-foot">
          <button class="chip-btn" data-copy="${k}">${ICON.copy}복사</button>
          <button class="chip-btn" data-edit="${k}">${ICON.edit}수정</button>
        </div>
      </div>
    </article>`;
  }

  function emptyCardHTML(d) {
    return `<article class="empty-card pal" style="${palStyle(paletteFor(d))}">
      ${ILLUS}
      <p class="empty-title">이 날의 말씀을 기다리고 있어요</p>
      <p class="empty-sub">마음에 남은 구절 하나를 기록해 보세요</p>
      <button class="btn primary" data-edit="${keyOf(d)}">구절 등록</button>
    </article>`;
  }

  function dayHTML() {
    const c = state.cursor, k = keyOf(c), t = todayDate(), s = startOfWeek(c);
    const strip = daysBetween(s, addDays(s, 6)).map((d) => {
      const dk = keyOf(d);
      const cls = ['strip-day', 'pal', dk === k ? 'is-sel' : '', sameDay(d, t) ? 'is-today' : ''].join(' ');
      return `<button class="${cls}" style="${palStyle(paletteFor(d))}" data-goto="${dk}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일">
        <span class="sd-w dow-${d.getDay()}">${DOW[d.getDay()]}</span><span class="sd-n">${d.getDate()}</span>
        <i class="sd-dot${db.get(dk) ? ' on' : ''}"></i></button>`;
    }).join('');

    const e = db.get(k);
    const streak = sameDay(c, t) ? streakCount() : 0;
    const extra = streak > 0
      ? `<div class="streak">${ICON.leaf}<span><b>${streak}일</b> 연속으로 말씀을 기록했어요</span></div>`
      : '<p class="hint">좌우로 밀어서 날짜를 이동할 수 있어요</p>';
    return `<div class="strip">${strip}</div>${e ? verseCardHTML(e, c) : emptyCardHTML(c)}${extra}`;
  }

  function weekHTML() {
    const s = startOfWeek(state.cursor), t = todayDate();
    const days = daysBetween(s, addDays(s, 6));
    const filled = days.filter((d) => db.get(keyOf(d))).length;
    const segs = days.map((d) => `<i class="pal${db.get(keyOf(d)) ? ' on' : ''}" style="${palStyle(paletteFor(d))}"></i>`).join('');

    const items = days.map((d) => {
      const k = keyOf(d), e = db.get(k), p = paletteFor(d);
      const body = e
        ? `${e.reference ? `<p class="wi-ref">${esc(e.reference)}</p>` : ''}<p class="wi-text">${esc(e.text)}</p>`
        : '<p class="wi-none">등록된 구절 없음</p>';
      return `<li><button class="week-item pal${e ? '' : ' is-empty'}${sameDay(d, t) ? ' is-today' : ''}" style="${palStyle(p)}" data-goto="${k}">
        <div class="wi-tile${e ? ' pal' : ''}"><span class="wi-w${e ? '' : ` dow-${d.getDay()}`}">${DOW[d.getDay()]}</span><span class="wi-n">${d.getDate()}</span></div>
        <div class="wi-body">${body}</div>${e ? ICON.chev : ''}</button></li>`;
    }).join('');

    return `<div class="week-summary"><span><b>${filled}</b> / 7일 기록</span><div class="wsegs">${segs}</div></div>
      <ul class="week-list">${items}</ul>`;
  }

  function monthHTML() {
    const c = state.cursor, y = c.getFullYear(), m = c.getMonth(), k = keyOf(c), t = todayDate();
    const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
    const head = DOW.map((w, i) => `<span class="mh dow-${i}">${w}</span>`).join('');
    const cells = daysBetween(startOfWeek(first), addDays(startOfWeek(last), 6)).map((d) => {
      const dk = keyOf(d);
      const cls = ['mc', 'pal', `dow-${d.getDay()}`, d.getMonth() !== m ? 'out' : '', sameDay(d, t) ? 'is-today' : '',
        dk === k ? 'is-sel' : '', db.get(dk) ? 'has' : ''].join(' ');
      return `<button class="${cls}" style="${palStyle(paletteFor(d))}" data-goto="${dk}"><span class="mc-n">${d.getDate()}</span></button>`;
    }).join('');

    const entries = daysBetween(first, last).map((d) => [d, db.get(keyOf(d))]).filter(([, e]) => e);
    const total = last.getDate();
    const ratio = entries.length / total;
    const C = 2 * Math.PI * 21;
    const ring = `<svg class="ring" viewBox="0 0 50 50" aria-hidden="true"><circle class="ring-bg" cx="25" cy="25" r="21"/>
      <circle class="ring-fg" cx="25" cy="25" r="21" stroke-dasharray="${(C * ratio).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 25 25)"/></svg>`;

    const list = entries.length
      ? entries.map(([d, e]) => `<li><button class="ml-item pal" style="${palStyle(paletteFor(d))}" data-goto="${keyOf(d)}">
          <i class="ml-dot"></i><span class="ml-date">${d.getDate()}일 (${DOW[d.getDay()]})</span>
          <span class="ml-ref">${esc(e.reference || e.text)}</span></button></li>`).join('')
      : '<li class="ml-none">이번 달에 등록된 구절이 없어요</li>';

    return `<div class="month"><div class="mgrid">${head}</div><div class="mgrid">${cells}</div></div>
      <div class="stats">
        <div class="stat ring-stat">${ring}<div><b>${entries.length}<small>/${total}</small></b><span>이달 기록</span></div></div>
        <div class="stat"><b>${streakCount()}<small>일</small></b><span>연속 기록</span></div>
        <div class="stat"><b>${db.size}<small>개</small></b><span>전체 구절</span></div>
      </div>
      <section class="month-list"><h3>${m + 1}월의 말씀 <span class="count">${entries.length}</span></h3><ul>${list}</ul></section>`;
  }

  function applyBodyPalette() {
    const p = paletteFor(state.cursor);
    const map = { '--pa': p.a, '--pb': p.b, '--pacc': p.acc, '--pda': p.da, '--pdb': p.db, '--pdacc': p.dacc };
    for (const [prop, val] of Object.entries(map)) document.body.style.setProperty(prop, val);
  }

  function renderNow() {
    renderHeader();
    applyBodyPalette();
    el.stage.innerHTML = state.view === 'day' ? dayHTML() : state.view === 'week' ? weekHTML() : monthHTML();
    el.seg.dataset.active = String(VIEWS.indexOf(state.view));
    el.seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
    updateBackupBadge();
  }

  function setView(v) {
    state.view = v;
    pref.set(KEYS.view, v);
    renderNow();
  }

  /* ================= 이동 / 스와이프 ================= */
  function moved(d, dir) {
    if (state.view === 'day') return addDays(d, dir);
    if (state.view === 'week') return addDays(d, dir * 7);
    return addMonths(d, dir);
  }

  async function slide(dir) {
    if (state.animating) return;
    state.animating = true;
    const w = el.viewport.clientWidth;
    const st = el.stage.style;
    st.transition = 'transform .18s ease-in, opacity .18s ease-in';
    st.transform = `translate3d(${-dir * w}px,0,0)`;
    st.opacity = '0';
    await wait(180);

    state.cursor = moved(state.cursor, dir);
    renderNow();
    st.transition = 'none';
    st.transform = `translate3d(${dir * w * 0.35}px,0,0)`;
    void el.stage.offsetWidth;
    st.transition = 'transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s';
    st.transform = 'translate3d(0,0,0)';
    st.opacity = '1';
    await wait(280);
    st.transition = '';
    state.animating = false;
  }

  function snapBack() {
    const st = el.stage.style;
    st.transition = 'transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s';
    st.transform = 'translate3d(0,0,0)';
    st.opacity = '1';
  }

  const touch = { active: false, axis: null, sx: 0, sy: 0, dx: 0, t0: 0 };

  el.viewport.addEventListener('touchstart', (e) => {
    if (state.animating || document.body.classList.contains('sheet-open') || e.touches.length !== 1) return;
    Object.assign(touch, { active: true, axis: null, sx: e.touches[0].clientX, sy: e.touches[0].clientY, dx: 0, t0: performance.now() });
    el.stage.style.transition = 'none';
  }, { passive: true });

  el.viewport.addEventListener('touchmove', (e) => {
    if (!touch.active) return;
    const mx = e.touches[0].clientX - touch.sx;
    const my = e.touches[0].clientY - touch.sy;
    if (!touch.axis) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      touch.axis = Math.abs(mx) > Math.abs(my) * 1.2 ? 'x' : 'y';
    }
    if (touch.axis !== 'x') return;
    if (e.cancelable) e.preventDefault();
    touch.dx = mx;
    el.stage.style.transform = `translate3d(${mx}px,0,0)`;
    el.stage.style.opacity = String(1 - Math.min(Math.abs(mx) / el.viewport.clientWidth, 1) * 0.5);
  }, { passive: false });

  function endTouch() {
    if (!touch.active) return;
    touch.active = false;
    if (touch.axis !== 'x') return;
    state.lastSwipeAt = performance.now();
    const w = el.viewport.clientWidth;
    const velocity = Math.abs(touch.dx) / Math.max(performance.now() - touch.t0, 1);
    if (Math.abs(touch.dx) > w * 0.22 || (velocity > 0.5 && Math.abs(touch.dx) > 30)) slide(touch.dx < 0 ? 1 : -1);
    else snapBack();
  }
  el.viewport.addEventListener('touchend', endTouch);
  el.viewport.addEventListener('touchcancel', endTouch);

  /* ================= 시트 공통 ================= */
  function openSheet(name) {
    document.body.dataset.sheet = name;
    document.body.classList.add('sheet-open');
  }
  function closeSheet() {
    document.body.classList.remove('sheet-open');
    delete document.body.dataset.sheet;
    if (document.activeElement) document.activeElement.blur();
  }

  /* ================= 등록 / 수정 ================= */
  function openEditor(k) {
    const e = db.get(k);
    state.editingKey = e ? k : null;
    el.editTitle.textContent = e ? '구절 수정' : '구절 등록';
    el.fDate.value = k;
    el.fRef.value = e ? e.reference : '';
    el.fText.value = e ? e.text : '';
    el.fNote.value = e ? e.note : '';
    el.delBtn.hidden = !e;
    openSheet('edit');
  }

  el.form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const date = el.fDate.value;
    if (!isValidKey(date)) { toast('날짜를 선택하세요'); return; }
    const entry = normalizeEntry({ date, reference: el.fRef.value, text: el.fText.value, note: el.fNote.value });
    if (!entry) { toast('본문을 입력하세요'); el.fText.focus(); return; }
    const oldKey = state.editingKey;
    if (date !== oldKey && db.get(date) && !confirm(`${date}에 이미 등록된 구절이 있어요. 덮어쓸까요?`)) return;

    try {
      db.transact((m) => {
        const prev = m.get(date) || (oldKey ? m.get(oldKey) : null);
        const now = new Date().toISOString();
        entry.createdAt = prev ? prev.createdAt : now;
        entry.updatedAt = now;
        if (oldKey && oldKey !== date) m.delete(oldKey);
        m.set(date, entry);
      });
    } catch (e) {
      toast(e.message);
      return;
    }
    state.cursor = parseKey(date);
    closeSheet();
    renderNow();
    toast('저장했어요');
  });

  el.delBtn.addEventListener('click', () => {
    const k = state.editingKey;
    if (!k || !confirm('이 날의 구절을 삭제할까요?')) return;
    try {
      db.transact((m) => m.delete(k));
    } catch (e) {
      toast(e.message);
      return;
    }
    closeSheet();
    renderNow();
    toast('삭제했어요');
  });

  async function copyVerse(k) {
    const e = db.get(k);
    if (!e) return;
    const text = e.reference ? `${e.text}\n— ${e.reference}` : e.text;
    try {
      await navigator.clipboard.writeText(text);
      toast('구절을 복사했어요');
    } catch (err) {
      console.warn('복사 실패', err);
      toast('복사하지 못했어요');
    }
  }

  /* ================= 보관함 / 백업 ================= */
  function lastBackupDate() {
    const v = pref.get(KEYS.backup);
    const d = v ? new Date(v) : null;
    return d && !isNaN(d) ? d : null;
  }

  function updateBackupBadge() {
    const last = lastBackupDate();
    const stale = !last || (Date.now() - last.getTime()) > BACKUP_REMIND_DAYS * DAY_MS;
    el.backupBadge.classList.toggle('on', db.size > 0 && stale);
  }

  async function updateSettings() {
    el.sTotal.textContent = `${db.size}개`;
    const last = lastBackupDate();
    el.sBackup.textContent = last ? `${last.getMonth() + 1}월 ${last.getDate()}일` : '없음';

    el.sPersist.classList.remove('warn');
    if (db.warning) {
      el.sPersist.textContent = db.warning;
      el.sPersist.classList.add('warn');
      return;
    }
    let persisted = false;
    try { persisted = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); } catch { /* 미지원 */ }
    el.sPersist.textContent = persisted
      ? '브라우저가 이 데이터를 영구 보관하도록 허용했어요.'
      : '저장 공간이 부족하거나 오래 사용하지 않으면 브라우저가 데이터를 정리할 수 있어요. 홈 화면에 추가해 사용하고, 백업 파일도 함께 보관하세요.';
  }

  function exportBackup() {
    if (!db.size) { toast('내보낼 구절이 없어요'); return; }
    const json = JSON.stringify(db.snapshot(), null, 2);
    const name = `daily-verse-backup-${keyOf(todayDate()).replace(/-/g, '')}.json`;
    const file = new File([json], name, { type: 'application/json' });
    const markDone = () => { pref.set(KEYS.backup, new Date().toISOString()); updateSettings(); updateBackupBadge(); };

    // 모바일: 공유 시트로 '파일에 저장' 가능 / 그 외: 다운로드
    const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (coarse && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '오늘의 말씀 백업' })
        .then(() => { markDone(); toast('백업 파일을 저장했어요'); })
        .catch((err) => { if (err.name !== 'AbortError') { console.warn('공유 실패, 다운로드로 대체', err); download(file); markDone(); } });
      return;
    }
    download(file);
    markDone();
    toast('백업 파일을 내보냈어요');
  }

  function download(file) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function importFiles(files) {
    const found = new Map();
    let skipped = 0;
    for (const f of files) {
      if (f.size > 10 * 1024 * 1024) { skipped++; continue; }
      try {
        extractEntries(JSON.parse(await f.text())).forEach((x) => {
          const n = normalizeEntry(x);
          if (n) found.set(n.date, n); else skipped++;
        });
      } catch (err) {
        console.warn(`불러오기 실패: ${f.name}`, err);
        skipped++;
      }
    }
    if (!found.size) { toast('불러올 구절을 찾지 못했어요'); return; }

    let add = 0, over = 0;
    found.forEach((_, k) => (db.get(k) ? over++ : add++));
    const msg = `구절 ${found.size}개를 불러올까요?\n새로 추가 ${add}개 · 덮어쓰기 ${over}개` + (skipped ? `\n(형식이 맞지 않아 건너뜀 ${skipped}개)` : '');
    if (!confirm(msg)) return;
    try {
      db.transact((m) => found.forEach((e, k) => m.set(k, e)));
    } catch (e) {
      toast(e.message);
      return;
    }
    renderNow();
    updateSettings();
    toast(`${found.size}개를 불러왔어요`);
  }

  /* ================= 이벤트 ================= */
  let toastTimer = 0;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2200);
  }

  el.stage.addEventListener('click', (e) => {
    if (performance.now() - state.lastSwipeAt < 350) return;
    const copy = e.target.closest('[data-copy]');
    if (copy) { copyVerse(copy.dataset.copy); return; }
    const edit = e.target.closest('[data-edit]');
    if (edit) { openEditor(edit.dataset.edit); return; }
    const go = e.target.closest('[data-goto]');
    if (go) { state.cursor = parseKey(go.dataset.goto); setView('day'); }
  });

  el.seg.addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]');
    if (b && b.dataset.view !== state.view) setView(b.dataset.view);
  });

  el.prevBtn.addEventListener('click', () => slide(-1));
  el.nextBtn.addEventListener('click', () => slide(1));
  el.todayBtn.addEventListener('click', () => { state.cursor = todayDate(); renderNow(); });
  el.fab.addEventListener('click', () => openEditor(keyOf(state.cursor)));
  el.settingsBtn.addEventListener('click', () => { updateSettings(); openSheet('settings'); });
  el.exportBtn.addEventListener('click', exportBackup);
  el.importBtn.addEventListener('click', () => el.importInput.click());
  el.importInput.addEventListener('change', () => {
    const files = [...el.importInput.files];
    el.importInput.value = '';
    if (files.length) importFiles(files);
  });
  el.backdrop.addEventListener('click', closeSheet);
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeSheet));

  document.addEventListener('keydown', (e) => {
    if (document.body.classList.contains('sheet-open')) { if (e.key === 'Escape') closeSheet(); return; }
    if (e.key === 'ArrowLeft') slide(-1);
    if (e.key === 'ArrowRight') slide(1);
  });

  // 자정이 지난 뒤 돌아오면 '오늘' 표시 갱신
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderNow(); });

  // 다른 탭에서 변경된 경우 동기화
  window.addEventListener('storage', (e) => {
    if (e.key !== KEYS.data) return;
    db.map = new Map();
    db.load();
    renderNow();
  });

  /* ================= 시작 ================= */
  db.load();
  renderNow();
  if (db.warning) toast(db.warning);
})();
</script>
</body>
</html>
